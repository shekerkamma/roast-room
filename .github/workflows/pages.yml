# Publish the room as a static site on GitHub Pages (https://<owner>.github.io/<repo>/).
# It replays the example councils and anything in councils/; your own sessions/ stay private.
# Councils still run locally in Claude Code with /roast-room.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the static room
        run: node app/scripts/export-static.mjs site
      - name: Publish to the gh-pages branch
        run: |
          cd site
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
